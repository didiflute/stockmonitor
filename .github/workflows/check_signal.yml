name: TQQQ Signal Check

on:
  # 每 5 分钟运行一次, 仅在美股盘中真正干活 (脚本内部判断)
  # 注意: GitHub Actions cron 最快 5 分钟一次, 实际可能延迟 0-15 分钟
  schedule:
    - cron: '*/5 13-21 * * 1-5'  # UTC 13:00-21:55 = ET 9:00-17:55 (覆盖盘中)
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限来 commit state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          # Pushover 推送 (主通道)
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_WENDI: ${{ secrets.PUSHOVER_USER_WENDI }}
          PUSHOVER_USER_HUSBAND: ${{ secrets.PUSHOVER_USER_HUSBAND }}
          # Gmail 邮件 (备份)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Yahoo 失败时的备源
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python src/main.py

      - name: Commit state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update state.json [skip ci]"
            git push
          fi
